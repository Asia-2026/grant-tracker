<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>India Research Grant Tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
:root{--bg:#11161b;--bg-alt:#161c22;--surface:#1b2229;--surface-2:#212a32;--paper:#ece3cc;--brass:#c9a04d;--brass-dim:#8e7233;--rust:#c25a32;--sage:#7ea077;--sage-dim:#536b4f;--amber:#bd7f3a;--text:#e8e3d6;--text-dim:#9c9686;--line:#2a3138;--line-soft:#232a30;--serif:'Source Serif 4',Georgia,serif;--mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);padding:0;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:28px 20px 60px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--brass);text-transform:uppercase;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.eyebrow::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--sage);box-shadow:0 0 0 3px rgba(126,160,119,.15)}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(24px,4vw,32px);letter-spacing:-.01em;margin-bottom:6px}
.sub{font-size:13px;color:var(--text-dim);font-family:var(--mono)}
.header-row{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px;margin-bottom:22px;border-bottom:1px solid var(--line);padding-bottom:20px}
@media print{.ticker-wrap,.controls,.btn-row,.toast{display:none!important}body{background:#fff;color:#111}.card,.stats,.stat{background:#fff;border-color:#ccc}.stat-num,.card-title{color:#111}}
.ticker-wrap{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:20px;overflow:hidden;display:flex;align-items:center}
.ticker-label{flex-shrink:0;background:var(--rust);color:#1b0d06;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.08em;padding:10px 12px;align-self:stretch;display:flex;align-items:center;text-transform:uppercase}
.ticker-track-outer{flex:1;overflow:hidden;position:relative;mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent)}
.ticker-track{display:flex;gap:28px;white-space:nowrap;padding:11px 24px;animation:ticker 36s linear infinite}
.ticker-wrap:hover .ticker-track{animation-play-state:paused}
@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.ticker-item{font-family:var(--mono);font-size:12px;color:var(--text-dim);display:flex;align-items:center;gap:7px}
.ticker-item b{color:var(--text);font-weight:500}
.ticker-item .dleft{color:var(--rust);font-weight:600}
.ticker-empty{font-family:var(--mono);font-size:12px;color:var(--text-dim);padding:11px 24px}
@media (prefers-reduced-motion:reduce){.ticker-track{animation:none;overflow-x:auto}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:20px}
.stat{background:var(--surface);padding:14px 16px}
.stat-num{font-family:var(--serif);font-size:24px;font-weight:600;color:var(--paper)}
.stat-lbl{font-family:var(--mono);font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.controls input,.controls select{font-family:var(--sans);font-size:13px;padding:9px 12px;background:var(--surface);border:1px solid var(--line);border-radius:6px;color:var(--text);outline:none;transition:border-color .15s}
.controls input{flex:2;min-width:160px}
.controls select{flex:1;min-width:130px}
.controls input:focus,.controls select:focus{border-color:var(--brass)}
.controls input::placeholder{color:var(--text-dim)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:0;display:flex;flex-direction:column;transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--brass-dim);transform:translateY(-2px)}
.card-head{padding:16px 16px 12px;border-bottom:1px solid var(--line-soft);position:relative}
.card-ref{font-family:var(--mono);font-size:10px;color:var(--text-dim);letter-spacing:.04em;margin-bottom:8px}
.tag-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:3px;letter-spacing:.03em;text-transform:uppercase}
.tag-org{background:rgba(201,160,77,.14);color:var(--brass)}
.tag-cat{background:rgba(255,255,255,.05);color:var(--text-dim)}
.card-title{font-family:var(--serif);font-size:15.5px;font-weight:600;line-height:1.35;color:var(--text)}
.new-badge{font-family:var(--mono);font-size:9px;padding:2px 6px;background:rgba(126,160,119,.18);color:var(--sage);border-radius:3px;margin-left:6px;vertical-align:middle;letter-spacing:.04em}
.stamp{position:absolute;top:14px;right:14px;font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border:1.5px double;border-radius:3px;transform:rotate(4deg);background:rgba(0,0,0,.15)}
.stamp-critical{color:var(--rust);border-color:var(--rust)}
.stamp-warn{color:var(--amber);border-color:var(--amber)}
.stamp-ok{color:var(--sage);border-color:var(--sage)}
.stamp-rolling{color:var(--text-dim);border-color:var(--line)}
.stamp-closed{color:var(--text-dim);border-color:var(--text-dim)}
.card-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:11px;flex:1}
.desc{font-size:12.5px;color:var(--text-dim);line-height:1.6;flex:1}
.tier{display:flex;align-items:center;gap:4px;font-family:var(--mono);color:var(--text-dim);font-size:11.5px}
.tier-dot{width:6px;height:6px;border-radius:50%;background:var(--line)}
.tier-dot.fill{background:var(--brass)}
.deadline-line{font-family:var(--mono);font-size:11px;color:var(--text-dim)}
.deadline-line b.critical{color:var(--rust)}
.deadline-line b.warn{color:var(--amber)}
.deadline-line b.ok{color:var(--sage)}
.deadline-line b.rolling{color:var(--text-dim)}
.deadline-line b.closed{color:var(--text-dim);text-decoration:line-through}
.bar-track{height:3px;background:var(--line-soft);border-radius:2px;overflow:hidden;margin-top:4px}
.bar-fill{height:100%;border-radius:2px}
.btn-row{display:flex;gap:8px;margin-top:2px}
.btn{flex:1;text-align:center;font-family:var(--mono);font-size:11.5px;padding:9px;border-radius:6px;text-decoration:none;letter-spacing:.02em;transition:all .15s;cursor:pointer;border:1px solid var(--line)}
.btn-primary{background:var(--brass);color:#1b160a;border-color:var(--brass);font-weight:600}
.btn-primary:hover{background:#d9af5d}
.btn-ghost{background:transparent;color:var(--text-dim)}
.btn-ghost:hover{border-color:var(--brass-dim);color:var(--brass)}
.doc-icon{font-size:10px;margin-right:3px}
.empty{grid-column:1/-1;text-align:center;padding:48px;color:var(--text-dim);font-family:var(--mono);font-size:13px}
.footer-note{margin-top:24px;font-family:var(--mono);font-size:10.5px;color:var(--text-dim);border-top:1px solid var(--line);padding-top:14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--brass);color:#1b160a;font-family:var(--mono);font-size:12px;font-weight:600;padding:9px 18px;border-radius:6px;opacity:0;transition:all .25s;pointer-events:none;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="header-row">
    <div>
      <div class="eyebrow">Grant Tracker · Live Status</div>
      <h1>India Research Grant Tracker</h1>
    </div>
  </div>
  <div class="ticker-wrap">
    <div class="ticker-label">Closing Soon</div>
    <div class="ticker-track-outer"><div class="ticker-track" id="ticker"></div></div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="controls">
    <input type="text" id="search" placeholder="Search grants, funders, sectors…">
    <select id="orgFilter"><option value="">All organizations</option></select>
    <select id="catFilter"><option value="">All categories</option></select>
    <select id="sortBy">
      <option value="deadline">Sort: Deadline (soonest)</option>
      <option value="tier">Sort: Funding scale</option>
      <option value="org">Sort: Organization</option>
    </select>
  </div>
  <div class="grid" id="grid"></div>
  <div class="footer-note">
    <span>Tracker — verify final dates on the official portal before submission</span>
  </div>
</div>
<div class="toast" id="toast">Link copied</div>

<script>
// ─────────────────────────────────────────────────────────────
// DATA — sirf yahan update karo. Updated: 20 Jul 2026
// tier: 1=Fellowship  2=Project grant  3=Large/institutional
// deadlineDate: "YYYY-MM-DD" or null if rolling
// docType: 'pdf' or 'page' (auto from URL if omitted)
// isNew: true = green NEW badge
// ─────────────────────────────────────────────────────────────
const GRANTS = [

  // ── NEW — added 25 Aug 2026 ─────────────────────────────────
  {
    ref: "DRDO/2CYCLE/26",
    title: "DRDO — Second Cycle Research Project Proposals 2026",
    org: "DRDO", cat: "Science & Engineering", tier: 3,
    deadlineDate: "2026-08-31", deadlineLabel: "31 Aug 2026",
    isNew: true,
    desc: "Second cycle call across DRDO's research boards (AR&DB, NRB, ARMREB, LSRB, DFTM, DIA-CoEs, TDF & EMR programmes) covering AI & ML, Quantum Technologies, Cyber Security, Robotics, Biomedical Engineering, Advanced Materials, Photonics, Space Technologies and more. Open to academic institutions and researchers nationwide.",
    url: "https://academyresearch.drdo.gov.in/",
    docType: "page"
  },
  {
    ref: "ICMR/VRDL/2026",
    title: "ICMR — Setting up Viral Research & Diagnosis Laboratories (VRDL)",
    org: "ICMR", cat: "Biomedical & Health", tier: 3,
    deadlineDate: "2026-09-30", deadlineLabel: "30 Sep 2026",
    isNew: true,
    desc: "Call for proposals to establish Viral Research and Diagnosis Laboratories (VRDL) in medical colleges, hospitals and medical institutions — part of ICMR's network for managing viral epidemics and outbreak diagnostics.",
    url: "https://www.icmr.gov.in/virus-research-diagnostic-laboratory-vrdl-network",
    docType: "page"
  },
  {
    ref: "ICMR/TRC-NE/2026",
    title: "ICMR — Technical Resource Centres in the North-Eastern States",
    org: "ICMR", cat: "Biomedical & Health", tier: 3,
    deadlineDate: "2026-09-15", deadlineLabel: "15 Sep 2026",
    isNew: true,
    desc: "EOI for establishing Technical Resource Centres across the North-Eastern states to strengthen regional research and diagnostic capacity in the region.",
    url: "https://www.icmr.gov.in/call-for-proposals",
    docType: "page"
  },

  // ── ICMR ────────────────────────────────────────────────────
 
  {
    ref: "ICMR/TB-SLUM/EOI",
    title: "ICMR Delhi TB Free Slum Demonstration Project — EOI",
    org: "ICMR", cat: "Biomedical & Health", tier: 2,
    deadlineDate: "2026-08-29", deadlineLabel: "29 Aug 2026",
    desc: "EOI for a new urban TB elimination demonstration project targeting Delhi slums under the ICMR TB Research Accelerator Program. Focuses on implementation and operational research for TB-free urban communities.",
    url: "https://www.icmr.gov.in/call-for-proposals",
    docType: "page"
  },
  {
    ref: "ICMR/CAR-MD/SPL",
    title: "ICMR Special Call — Centres for Advanced Research on Medical Devices",
    org: "ICMR", cat: "Biomedical & Health", tier: 3,
    deadlineDate: "2026-08-31", deadlineLabel: "31 Aug 2026, 17:00 hrs (extended)",
    desc: "Special call to establish ICMR Centres for Advanced Research (CAR) for priority medical devices and diagnostic technologies. Deadline extended from 15 Jul.",
    url: "https://www.icmr.gov.in/call-for-proposals",
    docType: "page"
  },

  // ── DST / USISTEF ───────────────────────────────────────────
  {
    ref: "DST/JSPS-IJ/2026",
    title: "DST-JSPS Indo-Japan Cooperative Science Programme 2026",
    org: "DST", cat: "International Collaboration", tier: 2,
    deadlineDate: "2026-09-03", deadlineLabel: "3 Sep 2026",
    desc: "Bilateral joint research under India-Japan Cooperative Science Programme. Open to Indian researchers for collaborative projects with Japanese counterparts across science and technology domains.",
    url: "https://phdtalks.org/2026/06/dst-jsps-call-for-proposal-2026.html",
    docType: "page"
  },

  // ── ANRF ────────────────────────────────────────────────────
  {
    ref: "ANRF/RF/2026",
    title: "ANRF-Ramanujan Fellowship 2026",
    org: "ANRF", cat: "Science & Engineering", tier: 1,
    deadlineDate: null, deadlineLabel: "Open year-round — no fixed deadline",
    desc: "For Indian scientists and engineers working abroad to return to India. ₹1.35L/month plus ₹7L/yr research grant for 5 years. Nominations accepted anytime.",
    url: "https://anrfonline.in/ANRF/Ramanujan_fellowship?HomePage=New"
  }
];
// ─────────────────────────────────────────────────────────────

let sortKey='deadline', activeOrg='', activeCat='';

function daysLeft(g){
  if(!g.deadlineDate) return null;
  const today=new Date(); today.setHours(0,0,0,0);
  const dl=new Date(g.deadlineDate+'T00:00:00');
  return Math.round((dl-today)/86400000);
}
function urgency(g){
  const d=daysLeft(g);
  if(d===null) return 'rolling';
  if(d<0) return 'closed';
  if(d<=7) return 'critical';
  if(d<=21) return 'warn';
  return 'ok';
}
function docType(g){
  if(g.docType) return g.docType;
  return g.url.toLowerCase().endsWith('.pdf')?'pdf':'page';
}
function deadlineBar(g){
  const d=daysLeft(g);
  if(d===null) return `<div class="bar-track"><div class="bar-fill" style="width:100%;background:var(--line)"></div></div>`;
  const pct=d<=0?100:Math.max(6,Math.min(100,Math.round((1-d/45)*100)));
  const color=d<=7?'var(--rust)':d<=21?'var(--amber)':'var(--sage)';
  return `<div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>`;
}
function tierDots(t){
  let h='';
  for(let i=1;i<=3;i++) h+=`<span class="tier-dot${i<=t?' fill':''}"></span>`;
  return h;
}
function tierLabel(t){return t===1?'Fellowship':t===2?'Project grant':'Large / institutional';}

function populateFilters(){
  const orgs=[...new Set(GRANTS.map(g=>g.org))].sort();
  const cats=[...new Set(GRANTS.map(g=>g.cat))].sort();
  document.getElementById('orgFilter').innerHTML='<option value="">All organizations</option>'+orgs.map(o=>`<option value="${o}">${o}</option>`).join('');
  document.getElementById('catFilter').innerHTML='<option value="">All categories</option>'+cats.map(c=>`<option value="${c}">${c}</option>`).join('');
}

function renderTicker(){
  const soon=GRANTS.map(g=>({g,d:daysLeft(g)})).filter(x=>x.d!==null&&x.d>=0&&x.d<=14).sort((a,b)=>a.d-b.d);
  const track=document.getElementById('ticker');
  if(!soon.length){
    track.parentElement.parentElement.querySelector('.ticker-label').textContent='All clear';
    track.outerHTML='<div class="ticker-empty" id="ticker">No grants closing within 14 days.</div>';
    return;
  }
  const items=soon.map(x=>`<span class="ticker-item"><b>${x.g.title}</b> · <span class="dleft">${x.d===0?'closes today':x.d+'d left'}</span></span>`).join('');
  track.innerHTML=items+items;
}

function renderStats(filtered){
  const orgs=new Set(filtered.map(g=>g.org));
  const soon=filtered.filter(g=>{const d=daysLeft(g);return d!==null&&d>=0&&d<=7;}).length;
  document.getElementById('stats').innerHTML=`
    <div class="stat"><div class="stat-num">${filtered.length}</div><div class="stat-lbl">Active calls</div></div>
    <div class="stat"><div class="stat-num">${orgs.size}</div><div class="stat-lbl">Organizations</div></div>
    <div class="stat"><div class="stat-num">${soon}</div><div class="stat-lbl">Closing ≤7 days</div></div>
    <div class="stat"><div class="stat-num">${new Set(filtered.map(g=>g.cat)).size}</div><div class="stat-lbl">Categories</div></div>`;
}

function copyLink(url){
  const showToast=()=>{const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1400);};
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(url).then(showToast).catch(()=>fallbackCopy(url,showToast));
  } else { fallbackCopy(url,showToast); }
}
function fallbackCopy(url,cb){
  const el=document.createElement('textarea');
  el.value=url; el.style.cssText='position:fixed;top:-9999px;left:-9999px;opacity:0';
  document.body.appendChild(el); el.focus(); el.select();
  try{document.execCommand('copy');cb();}catch(e){prompt('Copy this link:',url);}
  document.body.removeChild(el);
}

function render(){
  const q=document.getElementById('search').value.toLowerCase();
  let filtered=GRANTS.filter(g=>
    (!q||g.title.toLowerCase().includes(q)||g.desc.toLowerCase().includes(q)||g.cat.toLowerCase().includes(q)||g.org.toLowerCase().includes(q))&&
    (!activeOrg||g.org===activeOrg)&&
    (!activeCat||g.cat===activeCat)
  );
  if(sortKey==='deadline'){
    filtered.sort((a,b)=>{const da=daysLeft(a),db=daysLeft(b);if(da===null&&db===null)return 0;if(da===null)return 1;if(db===null)return -1;return da-db;});
  } else if(sortKey==='tier'){
    filtered.sort((a,b)=>b.tier-a.tier);
  } else {
    filtered.sort((a,b)=>a.org.localeCompare(b.org));
  }
  renderStats(filtered);
  const grid=document.getElementById('grid');
  if(!filtered.length){grid.innerHTML='<div class="empty">No grants match these filters.</div>';return;}
  grid.innerHTML=filtered.map(g=>{
    const u=urgency(g);
    const d=daysLeft(g);
    const sc=u==='critical'?'stamp-critical':u==='warn'?'stamp-warn':u==='rolling'?'stamp-rolling':u==='closed'?'stamp-closed':'stamp-ok';
    const st=u==='critical'?'Closing soon':u==='warn'?'Open':u==='rolling'?'Rolling':u==='closed'?'Check status':'Open';
    const dc=u==='critical'?'critical':u==='warn'?'warn':u==='rolling'?'rolling':u==='closed'?'closed':'ok';
    const dt=d===null?g.deadlineLabel:d<0?'Deadline passed — verify':d===0?'Closes today':`${d} days left`;
    const docL=docType(g)==='pdf'?'<span class="doc-icon">📄</span>PDF':'<span class="doc-icon">🔗</span>Page';
    const nb=g.isNew?'<span class="new-badge">NEW</span>':'';
    return `<div class="card">
      <div class="card-head">
        <span class="stamp ${sc}">${st}</span>
        <div class="card-ref">REF ${g.ref}</div>
        <div class="tag-row"><span class="tag tag-org">${g.org}</span><span class="tag tag-cat">${g.cat}</span></div>
        <div class="card-title">${g.title}${nb}</div>
      </div>
      <div class="card-body">
        <div class="desc">${g.desc}</div>
        <div class="tier" title="${tierLabel(g.tier)}">${tierDots(g.tier)} ${tierLabel(g.tier)}</div>
        <div>
          <div class="deadline-line">Deadline: <b class="${dc}">${dt}</b> <span style="opacity:.6">· ${g.deadlineLabel}</span></div>
          ${deadlineBar(g)}
        </div>
        <div class="btn-row">
          <a class="btn btn-primary" href="${g.url}" target="_blank" rel="noopener">${docL} · Open</a>
          <button class="btn btn-ghost" onclick="copyLink('${g.url}')">Copy link</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

document.getElementById('search').addEventListener('input',render);
document.getElementById('orgFilter').addEventListener('change',e=>{activeOrg=e.target.value;render();});
document.getElementById('catFilter').addEventListener('change',e=>{activeCat=e.target.value;render();});
document.getElementById('sortBy').addEventListener('change',e=>{sortKey=e.target.value;render();});

populateFilters();
renderTicker();
render();
</script>
</body>
</html>
